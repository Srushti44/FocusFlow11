name: Deploy - Docker Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Extract version from tag
      id: meta
      run: |
        if [ "${{ github.ref_type }}" = "tag" ]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=latest
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        
    - name: Build backend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.backend
        push: false
        tags: focusflow-backend:${{ steps.meta.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Test backend container
      run: |
        docker run --rm focusflow-backend:${{ steps.meta.outputs.version }} python -c "
        from backend.ml.service import get_inference_service
        service = get_inference_service()
        assert service.is_ready()
        print('✅ Container health check passed')
        "
        
    - name: Save backend image
      run: |
        docker save focusflow-backend:${{ steps.meta.outputs.version }} | gzip > backend-image.tar.gz
        
    - name: Upload backend image artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-docker-image
        path: backend-image.tar.gz
        retention-days: 7

  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Extract version from tag
      id: meta
      run: |
        if [ "${{ github.ref_type }}" = "tag" ]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=latest
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        
    - name: Build frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.frontend
        push: false
        tags: focusflow-frontend:${{ steps.meta.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Save frontend image
      run: |
        docker save focusflow-frontend:${{ steps.meta.outputs.version }} | gzip > frontend-image.tar.gz
        
    - name: Upload frontend image artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-docker-image
        path: frontend-image.tar.gz
        retention-days: 7

  deploy-summary:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    
    steps:
    - name: Create deployment summary
      run: |
        echo "## 🚀 Docker Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Images Built" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ focusflow-backend" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ focusflow-frontend" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Docker images are available as workflow artifacts." >> $GITHUB_STEP_SUMMARY
