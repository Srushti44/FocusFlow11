name: CI - Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest-cov ruff
        
    - name: Lint with ruff
      run: |
        ruff check backend/ --select E,F,W --ignore E501
      continue-on-error: true
      
    - name: Run pytest with coverage
      run: |
        pytest backend/tests/ backend/ml/tests/ -v \
          --cov=backend/ml \
          --cov-report=xml \
          --cov-report=term-missing \
          --cov-fail-under=70 \
          --maxfail=3
          
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: always()
      with:
        files: ./coverage.xml
        flags: unittests
        name: focusflow-coverage
      continue-on-error: true
      
    - name: Test ML model loading
      run: |
        python -c "
        from backend.ml.service import get_inference_service
        service = get_inference_service()
        assert service.is_ready(), 'Model failed to load'
        print(f'✅ Model loaded: {service.loaded_version}')
        "
        
    - name: Test API health endpoint
      run: |
        python -m pytest backend/tests/test_full_suite.py::test_health_endpoint -v

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install ruff
      run: pip install ruff
      
    - name: Run ruff linter
      run: ruff check backend/ --output-format=github
      continue-on-error: true
      
    - name: Run ruff formatter check
      run: ruff format backend/ --check
      continue-on-error: true
